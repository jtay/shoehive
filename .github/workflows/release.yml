name: Release

# Changesets opens (and keeps updated) a "Version Packages" PR while unreleased
# changesets exist on main. Merging that PR publishes to npm with provenance.
# While .changeset/pre.json is in "pre" mode, releases are 1.0.0-rc.x on the
# "rc" dist-tag. `pnpm changeset pre exit` in a PR makes the next release 1.0.0.
#
# The full check (every test and the dependency code they load) runs in its own job with a
# read-only token. Only the release job can push, open PRs or mint the OIDC token npm
# trusted publishing accepts, and it runs no more than install, build and publish.
# Actions are pinned to commit SHAs; the comment names the release each one is.

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    name: Full check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Full check before any publish
        run: pnpm check

  release:
    name: Version PR or publish
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write # npm provenance and trusted publishing
    steps:
      # changesets/action pushes with its github-token input, so checkout keeps no token.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      # No dependency cache in the job that publishes: it installs from the registry.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version-script: pnpm exec changeset version
          publish-script: pnpm release
          pr-title: 'chore: version packages'
          commit-message: 'chore: version packages'
        env:
          # Not needed once npm trusted publishing is configured for this repo.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
