name: Docs

# Builds the documentation site (website/) on every pull request as a check, and deploys it
# to GitHub Pages (shoehive.jtay.co.uk) on every push to main. The repository's Pages source
# must be set to "GitHub Actions".

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  # Never cancel a deploy half way; superseded PR builds can go.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Snippets type-check, em-dashes, generated pages
        run: pnpm docs:check
      - name: Build the site (with the TypeDoc API reference)
        run: pnpm docs:build
      - name: Links and em-dashes in the built site
        run: pnpm --filter @shoehive/website check:dist
      - name: Upload the Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: website/dist

  deploy:
    name: Deploy
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
