name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    # The store adapters' conformance and restart-recovery tests run against real servers
    # (RFC 0001 section 8). SQLite runs in-process.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: shoehive
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format
        run: pnpm format:check
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      # RFC 0001 phase 7: every TypeScript snippet on the docs site compiles. Also checks for
      # em-dashes and that generated reference pages agree with the source. The full site
      # build runs in docs.yml.
      - name: Docs snippets and style
        run: pnpm docs:check
      - name: Test
        run: pnpm test
        env:
          SHOEHIVE_TEST_POSTGRES_URL: postgres://postgres:shoehive@localhost:5432/postgres
          SHOEHIVE_TEST_REDIS_URL: redis://localhost:6379
      - name: Build
        run: pnpm build
      - name: Package checks (publint, attw, exports smoke test)
        run: pnpm check:package

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: End-to-end tests
        run: pnpm e2e

  scaffolder-e2e:
    name: Scaffolder end-to-end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          # The oldest supported Node, the one a new developer is most likely to hit problems on.
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      # Packs shoehive, scaffolds both templates with the built create-shoehive, installs them
      # with npm from the registry, runs their typecheck, test and build scripts, then plays a
      # full game against `npm start` and `npm run dev` (packages/create-shoehive/scripts/e2e.mjs).
      - name: Scaffold, install, test, build and play a generated project
        run: pnpm --filter create-shoehive e2e
